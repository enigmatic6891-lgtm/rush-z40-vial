# ─────────────────────────────────────────────────────────────────
# .github/workflows/build.yml
# Generated by QMK/Vial Wizard v5.6 on 2026-09-25
# ─────────────────────────────────────────────────────────────────
#
# This workflow automatically builds your firmware whenever you push
# changes to the keyboard folder. The compiled .uf2 / .hex / .bin
# file is uploaded as a GitHub Actions artifact you can download.
#
# HOW TO USE:
# 1. UNZIP this package. Push ALL extracted files/folders to the ROOT of a new GitHub repo.
#    Important: push the keyboards/ folder and .github/ folder, NOT the zip file itself.
# 2. Push a commit that touches keyboards/handwired/z40qmk/**
# 3. Go to Actions → latest run → download the artifact.
# 4. Flash the .uf2 (RP2040) or .hex (AVR) to your keyboard.
#
name: Build z40qmk
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout config
        uses: actions/checkout@v4

      - name: Clone Vial-QMK
        run: |
          git clone --depth=1 --branch=vial https://github.com qmk_firmware
          cd qmk_firmware
          git submodule update --init --recursive --depth=1

      - name: Copy Keyboard Configuration
        run: |
          # Создаем целевую структуру папок внутри Vial-QMK
          mkdir -p qmk_firmware/keyboards/handwired/z40qmk
          
          # Находим рабочую папку в вашем репозитории и копируем файлы
          FIND_DIR=$(find . -maxdepth 4 -name "rules.mk" -not -path "./qmk_firmware/*" | head -n 1 | xargs dirname)
          
          # Копируем основные файлы конфигурации (поддерживаем оба имени: info и keyboard)
          cp -f $FIND_DIR/info.json qmk_firmware/keyboards/handwired/z40qmk/info.json || true
          cp -f $FIND_DIR/keyboard.json qmk_firmware/keyboards/handwired/z40qmk/info.json || true
          cp -f $FIND_DIR/rules.mk qmk_firmware/keyboards/handwired/z40qmk/
          cp -f $FIND_DIR/config.h qmk_firmware/keyboards/handwired/z40qmk/
          
          # Копируем раскладку Vial
          mkdir -p qmk_firmware/keyboards/handwired/z40qmk/keymaps/vial
          cp -Rf $FIND_DIR/keymaps/vial/* qmk_firmware/keyboards/handwired/z40qmk/keymaps/vial/ || true

      - name: Setup QMK Environment
        run: |
          python3 -m pip install --user qmk
          cd qmk_firmware
          qmk setup -y

      - name: Compile Firmware for RP2040
        run: |
          cd qmk_firmware
          # Компилируем именно через современный движок QMK CLI под вашу плату
          qmk compile -kb handwired/z40qmk -km vial
          
      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rush-z40-vial-uf2
          path: qmk_firmware/*.uf2
